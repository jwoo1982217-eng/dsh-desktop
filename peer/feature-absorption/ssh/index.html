<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SSH 主机</title>
<link rel="stylesheet" href="/phone-features/ssh/page.css">
</head><body><main><h1>SSH 主机</h1><p>通过 SSH 打开远端 DSH。仅在点击测试、连接或启动后访问主机。</p><p id="status" role="status" aria-live="polite"></p><section id="hosts" aria-label="主机列表"></section>
<form id="host-form"><h2 id="form-title">添加主机</h2><label>名称<input id="name" required maxlength="80" autocomplete="off"></label><label>主机地址<input id="host" required placeholder="主机名或 IP，不填写网址" autocapitalize="none" spellcheck="false"></label><label>SSH 端口<input id="port" type="number" min="1" max="65535" value="22" required></label><label>用户名<input id="username" required autocomplete="off" autocapitalize="none"></label><label>认证方式<select id="auth"><option value="password">密码</option><option value="key">私钥</option></select></label><div id="password-fields"><label>密码<input id="password" type="password" autocomplete="new-password"></label></div><div id="key-fields" hidden><label>粘贴私钥<textarea id="privateKey" autocomplete="off" spellcheck="false"></textarea></label><label>私钥口令（可选）<input id="passphrase" type="password" autocomplete="new-password"></label></div><label>远端 DSH 端口<input id="remotePort" type="number" min="1" max="65535" value="3080" required></label><label>远端网页启动令牌（已有 DSH 时可选）<input id="webToken" type="password" autocomplete="new-password"></label><small>编辑时密码和密钥留空表示沿用。凭据保存到宿主凭据库。现有配对独立保留。SSH 主机不会自动安装 DSH；启动按钮仅启动已安装的 DSH。</small><button type="submit" id="save">保存主机</button><button type="button" id="reset-edit">取消编辑</button></form>
<dialog id="trust"><h2>确认首次主机指纹</h2><p id="trust-target"></p><code id="fingerprint"></code><p>请与主机管理员或可信渠道核对。确认后可再次测试或连接。</p><button type="button" id="trust-confirm">信任此指纹</button><button type="button" id="trust-cancel">取消</button></dialog></main><script type="module" src="/phone-features/ssh/client.js"></script></body></html>
