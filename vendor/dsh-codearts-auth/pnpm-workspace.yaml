allowBuilds:
  esbuild: true

# ⚠️ 不要在这里写 `包名@git+<URL>` 形式的键（issue IKJCOC 就是这么来的）。
#
# 本文件此前有一行
#   dsh-codearts-auth@git+https://gitee.com/iJetLi/deepseek-harness-codearts.git: true
# 它既无意义、又有害：
#   · 本仓库依赖里没有 `dsh-codearts-auth`（那是本包的**旧名**，现已改名为
#     `dsh-providers-hub`），该键永远匹配不上；
#   · 从 git 安装本插件时，pnpm 会在 clone 目录里执行本文件（`pnpm install` /
#     `prepare`），而 pnpm 10.x **解析这行键时就抛**
#     `ERR_PNPM_INVALID_VERSION_UNION`，install 直接失败 → `pnpm build:all` 起不来；
#   · pnpm 11.x 不抛错，但把它当 depPath 键、缺 `#<commit>` 故永不匹配（死键）。
# 实测矩阵与判据见 AGENTS.md「安装（git 插件）的 allowBuilds 键在 pnpm 10 / 11
# 语义互不兼容」一节。放行本包 build 脚本的写法属于**消费方 profile** 的配置，
# 不写在这里（详见 README「方式一：从 git 仓库安装」）。
